<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change Password | Waste Management Monitoring System</title>
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body>
  <div class="app-shell">
    <div data-sidebar="profile"></div>
    <main class="main-content portal-figma-page">
      <header class="edit-profile-header">
        <a class="portal-back-link" href="profile.html" aria-label="Back to profile">←</a>
        <h1>Change Password</h1>
      </header>
      <section class="account-action-page">
        <p class="local-auth-warning">Demo only: this password is stored in this browser. It does not protect an online account and is not synced across devices.</p>
        <p id="password-setup-status" class="account-action-intro"></p>
        <form id="change-password-form" class="account-action-form" novalidate>
          <p id="change-password-message" class="portal-message" role="status" hidden></p>
          <label id="current-password-group" class="account-action-field">
            <span>Current password</span>
            <input name="currentPassword" type="password" autocomplete="current-password" />
          </label>
          <label class="account-action-field">
            <span>New password</span>
            <input name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
            <small>Use at least 8 characters.</small>
          </label>
          <label class="account-action-field">
            <span>Confirm new password</span>
            <input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
          </label>
          <div class="profile-edit-actions">
            <button class="profile-save-button" type="submit">Save Password</button>
            <a class="profile-cancel-button" href="profile.html">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script src="sidebar.js?v=3"></script>
  <script src="auth.js?v=4"></script>
</body>
</html>
