<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>General Settings | Waste Management Monitoring System</title>
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body>
  <div class="app-shell">
    <div data-sidebar="settings"></div>
    <main class="main-content portal-figma-page">
      <header class="edit-profile-header">
        <a class="portal-back-link" href="settings.html" aria-label="Back to settings">←</a>
        <h1>General Settings</h1>
      </header>
      <section class="settings-page">
        <form id="settings-form" class="settings-list general-settings-list">
          <label class="settings-row"><span class="settings-row-icon">↻</span><span class="settings-row-copy"><strong>Report Updates</strong><small>Stay informed when your report status changes</small></span><input type="checkbox" name="reportUpdates" /></label>
          <label class="settings-row"><span class="settings-row-icon">▤</span><span class="settings-row-copy"><strong>New Comments</strong><small>Get notified when staff add a comment to your report</small></span><input type="checkbox" name="newComments" /></label>
          <label class="settings-row"><span class="settings-row-icon">◈</span><span class="settings-row-copy"><strong>System Announcements</strong><small>Receive important service announcements</small></span><input type="checkbox" name="systemAnnouncements" /></label>
          <label class="settings-row"><span class="settings-row-icon">✉</span><span class="settings-row-copy"><strong>Email Notifications</strong><small>Save this preference; email delivery is unavailable in this demo</small></span><input type="checkbox" name="emailNotifications" /></label>
          <div class="settings-actions"><p id="settings-message" class="portal-message" role="status" hidden></p><button class="profile-save-button" type="submit">Save Changes</button></div>
        </form>
      </section>
    </main>
  </div>
  <script src="sidebar.js?v=3"></script>
  <script src="portal.js?v=11"></script>
</body>
</html>
